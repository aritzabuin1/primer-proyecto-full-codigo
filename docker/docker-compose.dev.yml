services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ppfc-api
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mongo
      - qdrant
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: ppfc-mongo
    ports: ["27017:27017"]
    volumes:
      - ppfc-mongo-data:/data/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: ppfc-qdrant
    ports: ["6333:6333","6334:6334"]
    volumes:
      - ppfc-qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  ppfc-mongo-data:
  ppfc-qdrant-data:
