[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primer-proyecto-full-codigo"
version = "0.1.0"
description = "API base (FastAPI) para agente WA+RAG"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.112.2",
  "uvicorn[standard]==0.25.0",
  "pydantic==2.8.2",
  "pydantic-core==2.20.1",
  "httpx==0.27.2",
  "sentry-sdk==2.13.0",
  "pymongo==4.8.0",
  "qdrant-client==1.11.1",
  "chainlit==1.2.0",
  "langgraph==0.2.38",
  "langchain-core==0.3.10",
  "groq==0.11.0",
]


[tool.setuptools]
# Usamos discovery explícita para evitar que 'docker' cuente como paquete
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "config*"]
exclude = ["tests*", "docker*", "ops*", "scripts*"]

# (Opcional) Si prefieres lista explícita en vez de find:
# packages = ["app", "config"]
